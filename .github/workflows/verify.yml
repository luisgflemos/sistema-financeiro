name: Verificar aplicação

on: [push, pull_request]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      COMPOSE_PROJECT_NAME: finare-ci
    steps:
      - uses: actions/checkout@v4
      - name: Preparar ambiente
        run: cp .env.example .env
      - name: Iniciar aplicação
        run: docker compose up --detach --build
      - name: Verificar HTTP
        run: |
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:8000/health
          curl --fail --retry 15 --retry-all-errors --retry-delay 2 http://127.0.0.1:5173/api/health
          curl --fail http://127.0.0.1:5173/ | grep 'lang="pt-BR"'
      - name: Verificar código e restrições do banco
        run: |
          docker compose exec -T api ruff check .
          docker compose exec -T api ruff format --check .
          docker compose exec -T api pytest
          docker compose exec -T web npm run check
          docker compose exec -T web npm run build
      - name: Testar cadastros no navegador
        working-directory: frontend
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.51.1
          node tests/catalog-smoke.mjs
      - name: Verificar imagem do Railway e acesso individual
        run: |
          docker build -t finare-hosted .
          docker run --rm --network finare-ci_default --env-file .env -e POSTGRES_HOST=db finare-hosted alembic upgrade head
          docker run -d --name finare-hosted --network finare-ci_default --env-file .env \
            -e POSTGRES_HOST=db -e FINARE_ACCESS_USER=teste -e FINARE_ACCESS_PASSWORD=Teste8ok \
            -p 127.0.0.1:5273:8000 finare-hosted
          curl --fail --retry 10 --retry-all-errors --retry-delay 1 http://127.0.0.1:5273/health
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5273/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:5273/api/organizations)" = 401
          test "$(curl -s -u teste:senha-incorreta -o /dev/null -w '%{http_code}' http://127.0.0.1:5273/)" = 401
          curl --fail -u teste:Teste8ok http://127.0.0.1:5273/ | grep 'Finare | Cadastros'
          curl --fail -u teste:Teste8ok http://127.0.0.1:5273/api/organizations | grep 'Organização sintética'
      - name: Reaplicar migração no banco descartável
        run: |
          docker compose exec -T api alembic downgrade base
          docker compose exec -T api alembic upgrade head
          docker compose exec -T api pytest
      - name: Diagnosticar falha
        if: failure()
        run: |
          docker compose logs --no-color
          docker logs finare-hosted || true
      - name: Remover ambiente de CI
        if: always()
        run: |
          docker rm -f finare-hosted || true
          docker compose down --volumes
